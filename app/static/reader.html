<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>阅读 · 星皓书房</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/reader.css">
<script>
  (function () {
    var saved = localStorage.getItem('xh-theme');
    document.documentElement.dataset.theme = saved ? saved : 'dark';
  })();
</script>
<script>
  // epub.js 的渲染队列依赖 requestAnimationFrame；后台标签页里 rAF 会被完全暂停，
  // 导致在别的标签页打开的书永远停在“正在解析”。隐藏时改用消息通道兜底。
  (function () {
    var nativeRaf = window.requestAnimationFrame.bind(window);
    var channel = new MessageChannel();
    var queue = [];
    channel.port1.onmessage = function () {
      var cb = queue.shift();
      if (cb) cb(performance.now());
    };
    window.requestAnimationFrame = function (cb) {
      if (!document.hidden) return nativeRaf(cb);
      queue.push(cb);
      channel.port2.postMessage(0);
      return 0;
    };
    window.cancelAnimationFrame = function () {};
  })();
</script>
</head>
<body class="reader-body">

<div class="reader" id="reader" data-reader-theme="paper">

  <header class="r-bar">
    <a class="icon-btn" href="/" id="backBtn" aria-label="返回书架" title="返回书架">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div class="r-title">
      <span class="r-book" id="bookTitle">正在打开…</span>
      <span class="r-chapter" id="chapterTitle"></span>
    </div>
    <div class="r-tools">
      <button class="r-btn" data-panel="toc" title="目录">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
        <span>目录</span>
      </button>
      <button class="r-btn" data-panel="notes" title="笔记">
        <svg viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v14l-7-4-7 4V6a2 2 0 0 1 2-2z"></path></svg>
        <span>笔记</span>
        <i class="dot" id="noteCount" hidden></i>
      </button>
      <button class="r-btn" data-panel="search" title="全文搜索">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span>搜索</span>
      </button>
      <button class="icon-btn" id="bookmarkBtn" title="添加书签" aria-label="添加书签">
        <svg viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v14l-7-4-7 4V6a2 2 0 0 1 2-2z"></path></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="排版设置" aria-label="排版设置">
        <svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M8 19h8"></path></svg>
      </button>
    </div>
  </header>

  <main class="r-stage" id="stage">
    <div class="r-viewer" id="viewer"></div>
    <div class="r-loading" id="loading">
      <span class="spinner" aria-hidden="true"></span>
      <p id="loadingText">正在打开书…</p>
    </div>
    <div class="r-hint" id="hint" hidden>
      <span>← → 翻页</span><span>⌘K 搜索</span><span>Esc 关闭面板</span>
    </div>
  </main>

  <footer class="r-foot">
    <button class="icon-btn" id="prevBtn" aria-label="上一页">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div class="r-progress">
      <input id="slider" type="range" min="0" max="1000" value="0" step="1" aria-label="阅读进度">
    </div>
    <span class="r-percent" id="percent">0.0%</span>
    <button class="icon-btn" id="nextBtn" aria-label="下一页">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </footer>

  <aside class="r-side" id="side" aria-hidden="true">
    <div class="side-head">
      <div class="side-tabs" role="tablist">
        <button role="tab" data-tab="toc" aria-selected="true">目录</button>
        <button role="tab" data-tab="notes">笔记</button>
        <button role="tab" data-tab="marks">书签</button>
        <button role="tab" data-tab="search">搜索</button>
      </div>
      <button class="icon-btn" id="sideClose" aria-label="关闭面板">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="side-body">
      <div class="pane" data-pane="toc"><ul class="toc" id="tocList"></ul></div>
      <div class="pane" data-pane="notes" hidden><div class="note-list" id="noteList"></div></div>
      <div class="pane" data-pane="marks" hidden><div class="note-list" id="markList"></div></div>
      <div class="pane" data-pane="search" hidden>
        <form class="search-form" id="searchForm">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="searchInput" type="search" placeholder="搜索全书文字…" autocomplete="off">
        </form>
        <div class="search-meta" id="searchMeta"></div>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </aside>

  <aside class="r-settings" id="settings" aria-hidden="true">
    <div class="side-head">
      <h2>排版</h2>
      <button class="icon-btn" id="settingsClose" aria-label="关闭设置">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="settings-body">
      <section>
        <h3>布局</h3>
        <div class="seg" id="flowSeg">
          <button data-flow="paginated" data-spread="none">单栏</button>
          <button data-flow="paginated" data-spread="auto">双栏</button>
          <button data-flow="scrolled-doc" data-spread="none">滚动</button>
        </div>
      </section>
      <section>
        <h3>主题</h3>
        <div class="swatches" id="themeSwatches">
          <button data-theme="paper" style="--sw:#f5efe4" title="羊皮纸"><i></i>纸</button>
          <button data-theme="white" style="--sw:#fdfdfb" title="纯白"><i></i>白</button>
          <button data-theme="green" style="--sw:#e5eddf" title="护眼"><i></i>绿</button>
          <button data-theme="night" style="--sw:#15171b" title="夜间"><i></i>夜</button>
        </div>
      </section>
      <section>
        <h3>字体</h3>
        <div class="seg" id="fontSeg">
          <button data-font="serif">宋体</button>
          <button data-font="sans">黑体</button>
        </div>
      </section>
      <section>
        <h3>字号 <b id="sizeLabel">18</b></h3>
        <input type="range" id="sizeRange" min="14" max="30" step="1">
      </section>
      <section>
        <h3>行距 <b id="lineLabel">1.8</b></h3>
        <input type="range" id="lineRange" min="140" max="220" step="5">
      </section>
      <section>
        <h3>页边距 <b id="padLabel">48</b></h3>
        <input type="range" id="padRange" min="16" max="120" step="4">
      </section>
      <section>
        <h3>对齐</h3>
        <div class="seg" id="alignSeg">
          <button data-align="justify">两端</button>
          <button data-align="left">左对齐</button>
        </div>
      </section>
    </div>
  </aside>

  <div class="r-scrim" id="scrim" hidden></div>

  <div class="sel-bar" id="selBar" hidden>
    <button class="sw sw-yellow" data-color="yellow" title="黄色"></button>
    <button class="sw sw-green" data-color="green" title="绿色"></button>
    <button class="sw sw-blue" data-color="blue" title="蓝色"></button>
    <button class="sw sw-pink" data-color="pink" title="粉色"></button>
    <span class="sel-sep"></span>
    <button class="sel-act" data-action="note">
      <svg viewBox="0 0 24 24"><path d="M4 19V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9l-5 5H6a2 2 0 0 1-2-2z"></path><path d="M20 14h-5v5"></path></svg>
      笔记
    </button>
    <button class="sel-act" data-action="copy" title="复制">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 5H6a2 2 0 0 0-2 2v9"></path></svg>
    </button>
  </div>

  <div class="modal" id="noteDialog" hidden>
    <div class="modal-card">
      <h3 id="ndTitle">添加笔记</h3>
      <blockquote id="ndQuote"></blockquote>
      <textarea id="ndText" rows="4" placeholder="写下你的想法…"></textarea>
      <div class="modal-actions">
        <button class="btn ghost danger" id="ndDelete" hidden>删除</button>
        <button class="btn ghost" id="ndCancel">取消</button>
        <button class="btn primary" id="ndSave">保存</button>
      </div>
    </div>
  </div>

  <div class="toast-host" id="toastHost"></div>
</div>

<script src="/static/vendor/jszip.min.js"></script>
<script src="/static/vendor/epub.min.js"></script>
<script type="module" src="/static/js/reader.js"></script>
</body>
</html>
