services:
  library:
    build: .
    image: lumen:latest
    container_name: lumen
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 换成你的 Calibre 书库目录：容器内固定为 /library
      LIBRARY_PATH: /library
      DATA_DIR: /data
      SITE_NAME: 星皓书房
      # 界面语言：auto 跟随浏览器，也可写 zh / en
      LOCALE: "${LOCALE:-auto}"
      # 留空则不启用登录；设置了就会要求 HTTP Basic 口令
      LIBRARY_PASSWORD: "${LIBRARY_PASSWORD:-}"
      TZ: Asia/Shanghai
    volumes:
      # 默认用演示库。接入真实书库：在仓库根目录建 .env，写 CALIBRE_PATH=你的书库绝对路径
      - "${CALIBRE_PATH:-./demo-library}:/library:ro"
      - library-data:/data

volumes:
  library-data:
