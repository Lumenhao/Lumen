# 我的图书馆 — Hugo 配置
# baseURL 保持根路径即可：本地预览直接用 http://localhost:1313/
# 发布到 GitHub Pages 时，CI 会自动传入真实地址（见 .github/workflows/deploy.yml）
baseURL = '/'
title = "星皓书房"
theme = 'hugo-book'

defaultContentLanguage = 'zh'
enableGitInfo = true
disablePathToLower = true
uglyurls = true
relativeurls = false

copyright = '© 2026 Haoming Xing'

[markup]
[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions]
  typographer = false
[markup.goldmark.extensions.footnote]
  enable = true
  backlink = true
  linkStyle = 'superscript'
  title = '查看脚注'
[markup.goldmark.extensions.passthrough]
  enable = true
[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$'], ['\[', '\]']]
  inline = [['$', '$'], ['\(', '\)']]
[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false
[markup.highlight]
  style = 'github'
  lineNos = false
  noClasses = false

[outputs]
  home = ['html', 'rss']

[taxonomies]
  tag = 'tags'
  category = 'categories'

[languages.zh]
  label = '中文'
  locale = 'zh-CN'
  weight = 1

[params]
  BookTheme = 'auto'
  BookSection = '*'
  BookSearch = true
  BookComments = false
  BookDateFormat = '2006-01-02'
  BookPortableLinks = 'warning'

# 发布到 GitHub 后取消注释，并把地址换成你的仓库
[[menu.after]]
  name = 'GitHub'
  url = 'https://github.com/Lumenhao/Library'
  weight = 10
