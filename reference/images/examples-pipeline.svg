<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="从源文件到网站的流程">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a8f98"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" rx="16" fill="#fafafa"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <g>
      <rect x="40" y="95" width="170" height="110" rx="14" fill="#eef2f7" stroke="#c9d3df" stroke-width="1.5"/>
      <text x="125" y="140" font-size="20" fill="#2b3440" font-weight="600">源文件</text>
      <text x="125" y="170" font-size="15" fill="#5f6b7a">PDF / EPUB</text>
    </g>
    <line x1="215" y1="150" x2="265" y2="150" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="270" y="95" width="170" height="110" rx="14" fill="#eaf5f1" stroke="#bfe0d4" stroke-width="1.5"/>
      <text x="355" y="140" font-size="20" fill="#1f4d3d" font-weight="600">Markdown</text>
      <text x="355" y="170" font-size="15" fill="#4a6b5f">清洗 · 分章</text>
    </g>
    <line x1="445" y1="150" x2="495" y2="150" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="500" y="95" width="190" height="110" rx="14" fill="#fdf3e7" stroke="#eed3ae" stroke-width="1.5"/>
      <text x="595" y="132" font-size="20" fill="#5a3d1f" font-weight="600">content/books/</text>
      <text x="595" y="160" font-size="15" fill="#7a5c3a">&lt;slug&gt;/_index.md</text>
      <text x="595" y="182" font-size="15" fill="#7a5c3a">ch01.md · images/</text>
    </g>
    <line x1="695" y1="150" x2="745" y2="150" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="750" y="95" width="110" height="110" rx="14" fill="#eef7fb" stroke="#bfd9e6" stroke-width="1.5"/>
      <text x="805" y="140" font-size="20" fill="#1f4459" font-weight="600">网页</text>
      <text x="805" y="170" font-size="14" fill="#4a6577">GitHub</text>
      <text x="805" y="190" font-size="14" fill="#4a6577">Pages</text>
    </g>
    <text x="450" y="52" font-size="16" fill="#6b7684">一本书变成网页的流程</text>
  </g>
</svg>
